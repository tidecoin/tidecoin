[[patches]]
id = "shared-compat-clang-version"
patch_file = "src/pq/patches/shared-compat-clang-version.patch"
summary = "Use Clang's actual major-version macro in the compiler compatibility shim."
reason = "Avoid treating modern Clang as pre-9 and make the C compiler's undefined-macro check pass."
owner = "Tidecoin developers"
consensus_impact = "none"
files = ["src/pq/compat.h"]

[[patches]]
id = "shared-fips202-cleanup"
patch_file = "src/pq/patches/shared-fips202-cleanup.patch"
summary = "Clear SHAKE and SHA-3 workspaces before release."
reason = "Erase allocated states and temporary buffers after use and reset released context pointers."
owner = "Tidecoin developers"
consensus_impact = "none"
files = ["src/pq/fips202.c"]

[[patches]]
id = "falcon-512-local-adaptations"
patch_file = "src/pq/patches/falcon-512-local-adaptations.patch"
summary = "Tidecoin integration adaptations for Falcon-512 clean implementation."
reason = "Expose deterministic keygen, route RNG/fips202 includes to Tidecoin-local adapters, require exact compressed signatures in strict verification, release signing SHAKE contexts on encoding failure, and clear key-generation/signing workspaces including sampler and PRNG temporaries."
owner = "Tidecoin developers"
consensus_impact = "direct"
files = [
  "src/pq/falcon-512/api.h",
  "src/pq/falcon-512/inner.h",
  "src/pq/falcon-512/pqclean.c",
  "src/pq/falcon-512/keygen.c",
  "src/pq/falcon-512/rng.c",
  "src/pq/falcon-512/sign.c",
]

